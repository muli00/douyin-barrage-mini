<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 直播助播导播台</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 顶部总控与房间切换栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎙️</span>
      <div>
        <h1>AI 直播助播导播台</h1>
        <div class="sub-status">
          <span id="wsDot" class="dot"></span>
          <span id="wsStatusText">连接后台中...</span>
          <span class="divider">|</span>
          <span id="roomBadge" class="room-badge idle">未连接直播间</span>
        </div>
      </div>
    </div>

    <div class="room-bar">
      <input
        type="text"
        id="liveUrlInput"
        placeholder="输入抖音直播间地址（如 https://live.douyin.com/房间号）"
      />
      <button class="btn primary" id="connectBtn" onclick="connectRoom()">🔌 连接/切换</button>
      <button class="btn ghost" id="disconnectBtn" onclick="disconnectRoom()">⏹️ 断开</button>
    </div>

    <div class="top-actions">
      <button id="unlockAudioBtn" class="btn warning" onclick="unlockAudio()">
        🔇 激活声音输出
      </button>
      <button class="btn ghost" onclick="openSettings()">⚙️ 系统设置</button>
    </div>
  </header>

  <div id="errorBanner" class="error-banner hidden"></div>

  <!-- 快捷开关与音色控制条 -->
  <section class="control-strip">
    <div class="pitch-btns">
      <button class="btn success" id="startPitchBtn" onclick="voiceAction('start_pitch')">
        ▶️ 开始循环讲品
      </button>
      <button class="btn danger" id="pausePitchBtn" onclick="voiceAction('pause_pitch')">
        ⏸️ 暂停讲品
      </button>
    </div>

    <div class="toggles">
      <label class="toggle-pill">
        <input type="checkbox" id="aiEnabledToggle" onchange="quickSaveToggles()" />
        <span>🤖 AI 总开关</span>
      </label>
      <label class="toggle-pill">
        <input type="checkbox" id="voiceQaToggle" onchange="quickSaveToggles()" />
        <span>🎤 弹幕语音答疑</span>
      </label>
      <label class="toggle-pill">
        <input type="checkbox" id="textReplyToggle" onchange="quickSaveToggles()" />
        <span>⌨️ 小号公屏打字</span>
      </label>
      <label class="toggle-pill">
        <input type="checkbox" id="dryRunToggle" onchange="quickSaveToggles()" />
        <span>🛡️ 公屏演习(不真发)</span>
      </label>
    </div>

    <div class="voice-selects">
      <select id="voiceSelect" onchange="quickSaveToggles()"></select>
      <select id="rateSelect" onchange="quickSaveToggles()">
        <option value="-5%">温柔慢速 (-5%)</option>
        <option value="+0%">标准语速 (+0%)</option>
        <option value="+8%">自然带货 (+8%)</option>
        <option value="+15%">激情快语 (+15%)</option>
      </select>
    </div>
  </section>

  <!-- 主工作区：左文稿导播 + 右实时监控 -->
  <main class="workspace">
    <!-- 左栏 -->
    <section class="panel">
      <div class="generator-box">
        <div class="section-title">📦 喂入商品链接 · AI 自动提取写稿</div>
        <div class="gen-inputs">
          <input
            type="text"
            id="productUrlInput"
            placeholder="粘贴抖音商品链接（可选，自动借用本机已登录浏览器提取标题参数）"
          />
          <input
            type="text"
            id="extraNotesInput"
            placeholder="补充几号链接 / 直播活动价 / 核心卖点（如：1号链接活动价59元，杭州现货48h发）"
          />
        </div>
        <div class="gen-footer">
          <button class="btn primary" id="genScriptBtn" onclick="generateScript()">
            ✨ AI 生成口播稿 & 同步知识库
          </button>
          <span id="genStatusText" class="muted"></span>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="director" onclick="switchTab('director')">
          🎬 逐句导播视图（实时高亮）
        </button>
        <button class="tab" data-tab="pitch" onclick="switchTab('pitch')">
          📝 编辑口播稿 (pitch.txt)
        </button>
        <button class="tab" data-tab="knowledge" onclick="switchTab('knowledge')">
          📚 编辑答疑知识库 (knowledge.txt)
        </button>
      </div>

      <!-- 标签页 1：逐句高亮导播列表 -->
      <div id="tab-director" class="tab-body">
        <div id="pitchList" class="pitch-list"></div>
      </div>

      <!-- 标签页 2：编辑 pitch.txt -->
      <div id="tab-pitch" class="tab-body hidden">
        <textarea id="pitchEditor" rows="13" placeholder="每行一句短口播词，# 开头为注释"></textarea>
        <div class="editor-actions">
          <button class="btn success" onclick="saveScripts()">💾 保存口播稿（立即热生效）</button>
          <span id="savePitchHint" class="muted"></span>
        </div>
      </div>

      <!-- 标签页 3：编辑 knowledge.txt -->
      <div id="tab-knowledge" class="tab-body hidden">
        <textarea id="knowledgeEditor" rows="13" placeholder="填写助播人设、商品尺码价格、快递售后说明"></textarea>
        <div class="editor-actions">
          <button class="btn success" onclick="saveScripts()">💾 保存知识库（立即热生效）</button>
          <span id="saveKnowledgeHint" class="muted"></span>
        </div>
      </div>
    </section>

    <!-- 右栏 -->
    <section class="panel right-panel">
      <div id="nowSpeakingCard" class="speaking-card">
        <div class="speaking-head">
          <span id="speakingBadge" class="badge">🎙️ 语音待命中</span>
          <span class="muted">待插播答疑排队：<strong id="qaQueueCount">0</strong> 条</span>
        </div>
        <div id="speakingText" class="speaking-text">
          开播前请先点击右上角「激活声音输出」，再点「开始循环讲品」。
        </div>
      </div>

      <div class="section-title" style="margin-top: 14px;">💬 实时弹幕与 AI 动作监控流</div>
      <div id="eventFeed" class="event-feed"></div>

      <div class="manual-bar">
        <input
          type="text"
          id="manualInput"
          placeholder="输入临时控场话术（如：1号链接最后5单马上截单啦！）"
          onkeydown="if(event.key==='Enter') manualInterject('interject_voice')"
        />
        <button class="btn warning" onclick="manualInterject('interject_voice')">
          🔊 立即语音插播
        </button>
        <button class="btn primary" onclick="manualInterject('send_text')">
          ⌨️ 公屏发弹幕
        </button>
      </div>
    </section>
  </main>

  <!-- 系统设置弹窗 -->
  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ 系统与大模型设置（保存至 config.json）</h2>
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <label>大模型接口地址 (LLM_BASE_URL)</label>
        <input type="text" id="cfgBaseUrl" placeholder="https://api.deepseek.com" />

        <label>大模型密钥 (LLM_API_KEY) <span id="apiKeyHint" class="muted"></span></label>
        <input type="password" id="cfgApiKey" placeholder="留空则保持原密钥不变；输入新 sk-... 则更新" />

        <div class="two-col">
          <div>
            <label>模型名称 (LLM_MODEL)</label>
            <input type="text" id="cfgModel" placeholder="deepseek-chat" />
          </div>
          <div>
            <label>助播小号昵称（防回复自己死循环）</label>
            <input type="text" id="cfgBotNick" placeholder="填写助播抖音昵称" />
          </div>
        </div>

        <div class="two-col">
          <div>
            <label>答疑最小冷却间隔（秒）</label>
            <input type="number" id="cfgCooldown" min="1" step="1" />
          </div>
          <div>
            <label>本机浏览器 CDP 地址（留空用内置无头浏览器）</label>
            <input type="text" id="cfgCdpUrl" placeholder="http://host.docker.internal:9222" />
          </div>
        </div>

        <label>直播违禁词拦截表（英文逗号分隔）</label>
        <input type="text" id="cfgBannedWords" />

        <label class="toggle-pill" style="margin-top: 12px; display: inline-flex;">
          <input type="checkbox" id="cfgOnlyChat" />
          <span>仅监听聊天弹幕（过滤进房/点赞刷屏）</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn ghost" onclick="closeSettings()">取消</button>
        <button class="btn success" onclick="saveSettingsModal()">💾 保存设置（立即生效）</button>
      </div>
    </div>
  </div>

  <audio id="ttsPlayer" preload="auto"></audio>
  <script src="/static/app.js"></script>
</body>
</html>
