services:
  douyin:
    build: .
    volumes:
      - .:/app
    ports:
      - "8888:8888"
      - "8889:8889"
    # 给 Chromium 分配足够的共享内存，防止在 Docker 中页面崩溃
    shm_size: "1gb"
    environment:
      - TZ=Asia/Shanghai
      - WS_PORT=8888
      - WEB_PORT=8889
      - CDP_URL=${CDP_URL:-http://host.docker.internal:9222}
    stdin_open: true
    tty: true
