syntax = "proto3";
package douyin;

message PushFrame {
  uint64 seqId = 1;
  uint64 logId = 2;
  uint64 service = 3;
  uint64 method = 4;
  repeated HeadersList headersList = 5;
  string payloadEncoding = 6;
  string payloadType = 7;
  bytes payload = 8;
}

message HeadersList {
  string key = 1;
  string value = 2;
}

message Response {
  repeated Message messagesList = 1;
  string cursor = 2;
  uint64 fetchInterval = 3;
  uint64 now = 4;
  string internalExt = 5;
  uint32 fetchType = 6;
  map<string, string> routeParams = 7;
  uint64 heartbeatDuration = 8;
  bool needAck = 9;
  string pushServer = 10;
  string liveCursor = 11;
}

message Message {
  string method = 1;
  bytes payload = 2;
  int64 msgId = 3;
}

message User {
  uint64 id = 1;
  string nickName = 3;
}

// 聊天弹幕: WebcastChatMessage
message ChatMessage {
  User user = 2;
  string content = 3;
}

// 进房消息: WebcastMemberMessage
message MemberMessage {
  User user = 2;
}

// 点赞消息: WebcastLikeMessage
message LikeMessage {
  uint64 count = 2;
  uint64 total = 3;
  User user = 5;
}

// 关注消息: WebcastSocialMessage
message SocialMessage {
  User user = 2;
}

// 直播间人数统计: WebcastRoomStatsMessage
message RoomStatsMessage {
  string displayShort = 2;
  string displayMiddle = 3;
  string displayLong = 4;
  int64 displayValue = 5;
}

// 礼物结构与消息: WebcastGiftMessage
message GiftStruct {
  uint64 diamondCount = 12;
  string name = 16;
}

message GiftMessage {
  uint64 giftId = 2;
  uint64 comboCount = 6;
  User user = 7;
  GiftStruct gift = 15;
}
